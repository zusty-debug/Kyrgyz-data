databases:
  - name: kyrgyz-data-db
    plan: free

services:
  - type: web
    name: kyrgyz-data-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kyrgyz-data-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MIN
        value: 60
      - key: DATA_URL
        value: https://files.catbox.moe/d1ktyc.txt

  # Telegram bot — runs as a Web Service on free tier (Background Workers are
  # paid-only on Render). The startCommand starts a tiny HTTP server (for
  # Render healthchecks) AND the bot polling loop.
  - type: web
    name: kyrgyz-tg-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    startCommand: bash /app/scripts/start_bot.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kyrgyz-data-db
          property: connectionString
      - key: API_URL
        value: https://kyrgyz-data-api.onrender.com
      - key: API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: DEV_HANDLE
        value: "@xzusty"
      - key: DAILY_QUOTA
        value: 5
      - key: PER_PAGE
        value: 5
